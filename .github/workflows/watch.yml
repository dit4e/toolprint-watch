name: watch

# The longitudinal collector. Every run compares a fixed list of public MCP
# servers against an approved baseline and records what changed.
#
# The git history of baseline.json IS the dataset: every commit that touches it
# is a definition change, with a timestamp and a diff. No storage to build, and
# the record is publishable evidence rather than a private database.
#
# observations.csv carries the denominator - how many server-days produced no
# drift - because a drift rate needs both halves.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour to avoid the thundering herd
  workflow_dispatch:

# The GITHUB_TOKEN needs nothing beyond read: the commit is pushed with a
# deploy key scoped to this repository alone.
permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

env:
  # Not a secret, and deliberately visible. Several MCP servers gate tools/list
  # on an environment variable being SET, not on it being valid - they check the
  # credential at tools/call. So they can be watched with a placeholder and no
  # real API key, which removes the whole question of protecting one.
  WATCH_PLACEHOLDER: "not-a-real-key-0000000000"

  # Pinned rather than floating: the collector's job is to detect when tool
  # definitions change, so the measuring instrument must not change underneath
  # the measurement. Bump deliberately, and treat a bump as a re-baseline event.
  TOOLPRINT_SPEC: "toolprint[tokens]==0.2.0"

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # This job downloads and executes 36 third-party packages - the very
          # packages it exists to be suspicious of - in this workspace. By
          # default actions/checkout writes a push-capable token into
          # .git/config, so any one of them could read it and push to this
          # repository. The token is supplied at the commit step instead, after
          # all third-party code has finished running.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5

      - name: Install toolprint
        run: pip install --quiet "$TOOLPRINT_SPEC"

      - name: The watchlist must stay credential-free
        # Enforced rather than remembered. toolprint audits its own watchlist:
        # a literal credential pasted into servers.json is HYG-002, which exits
        # 1 and fails the job before anything is contacted or committed. A
        # "${VAR}" reference - including a prefixed one like "xoxb-${VAR}" -
        # passes.
        run: toolprint scan --config servers.json --fail-on high

      - name: Observe
        id: observe
        run: |
          set +e
          mkdir -p observations
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ ! -f baseline.json ]; then
            toolprint baseline --yes --timeout 120 \
              --config servers.json --baseline baseline.json \
              --by "watch workflow" --note "first observation"
            echo "drift=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --min-coverage 0 because this job does its own coverage accounting:
          # the denominator row records how many servers actually answered, and
          # a shortfall raises a workflow warning. A research collector should
          # record a degraded day, not refuse to.
          toolprint check --yes --timeout 120 --fail-on none --min-coverage 0 \
            --config servers.json --baseline baseline.json \
            --format json --out "observations/$DATE.json" \
            --findings "$RUNNER_TEMP/findings.json"
          DRIFT=$(python -c "import json;print(len(json.load(open('observations/$DATE.json'))['changes']))")
          NEW=$(python -c "import json;print(len(json.load(open('observations/$DATE.json'))['new_servers']))")
          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          # approve re-contacts every server, so running it unconditionally meant
          # 72 cold package fetches a day rather than 36 - on most days to
          # approve nothing at all. Gated on there being something to accept:
          # drift to record, or a server added to servers.json since the last
          # run. Both jobs still happen, just not for free every night.
          if [ "$DRIFT" != "0" ] || [ "$NEW" != "0" ]; then
            toolprint approve --yes --timeout 120 \
              --config servers.json --baseline baseline.json \
              --by "watch workflow" --note "observed $DATE"
          else
            echo "nothing to approve; not re-contacting the servers"
          fi
          exit 0

      - name: Explain any unreachable servers
        run: |
          python - "$RUNNER_TEMP/findings.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          if not os.path.exists(path):
              sys.exit(0)
          bad = [s for s in json.load(open(path))["servers"]
                 if s["fetch_status"] not in ("ok", "not_attempted")]
          if not bad:
              print("every server answered")
              sys.exit(0)
          print("{} server(s) did not answer:".format(len(bad)))
          for s in sorted(bad, key=lambda s: s["name"]):
              print("  {:<24} {:<14} {}".format(
                  s["name"], s["fetch_status"], (s["fetch_detail"] or "")[:90]))
          PY

      - name: Record the denominator
        env:
          OBS_DATE: ${{ steps.observe.outputs.date }}
          OBS_DRIFT: ${{ steps.observe.outputs.drift }}
        run: |
          python - "$OBS_DATE" "$OBS_DRIFT" "$RUNNER_TEMP/findings.json" <<'PY'
          import csv, json, os, sys
          date, drift, findings_path = sys.argv[1], sys.argv[2], sys.argv[3]

          # Measured from this run, not read back out of the baseline. The
          # earlier version reported the baseline's server count as "reachable",
          # so a day where two thirds of the servers failed to start looked
          # exactly like a quiet day: unreachable servers produce no drift.
          watched = len(json.load(open("servers.json"))["mcpServers"])
          reachable = tools = 0
          if os.path.exists(findings_path):
              doc = json.load(open(findings_path))
              ok = [s for s in doc["servers"] if s["fetch_status"] == "ok"]
              reachable = len({(s["name"], s["url_host"] or s["command_basename"]) for s in ok})
              tools = sum(s["tool_count"] or 0 for s in ok)

          path = "observations.csv"
          new = not os.path.exists(path)
          with open(path, "a", newline="") as fh:
              w = csv.writer(fh)
              if new:
                  w.writerow(["date", "watched", "reachable", "tools", "drift_changes"])
              w.writerow([date, watched, reachable, tools, drift])
          print("watched={} reachable={} tools={} drift={}".format(
              watched, reachable, tools, drift))
          if reachable < watched:
              print("::warning::{} of {} servers were not reachable this run".format(
                  watched - reachable, watched))
          PY

      - name: Commit
        env:
          OBS_DATE: ${{ steps.observe.outputs.date }}
          OBS_DRIFT: ${{ steps.observe.outputs.drift }}
          OBS_NEW: ${{ steps.observe.outputs.new }}
          DEPLOY_KEY: ${{ secrets.WATCH_DEPLOY_KEY }}
        run: |
          # A deploy key rather than GITHUB_TOKEN: it can write to this one
          # repository and nothing else in the organisation, and the org's
          # default workflow permissions stay read-only for every other repo.
          # It is loaded here, at the last step, so it is never present while
          # the watched packages are executing.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config user.name "toolprint watch"
          git config user.email "noreply@github.com"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          DRIFT="$OBS_DRIFT"
          DATE="$OBS_DATE"
          NEW="$OBS_NEW"
          SUFFIX=""
          if [ "${NEW:-0}" != "0" ]; then SUFFIX=", $NEW newly watched"; fi
          if [ "$DRIFT" = "0" ]; then
            git commit -m "watch $DATE: no drift$SUFFIX"
          else
            git commit -m "watch $DATE: $DRIFT change(s) observed$SUFFIX"
          fi
          # The observation takes about ten minutes and commits at the end, so
          # anything pushed to this repository meanwhile leaves this checkout
          # behind and the push is rejected - losing the day's observation, and
          # failing quietly unless someone goes looking. Rebase onto whatever
          # arrived and retry; the commits are additive.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch -q origin main
            git rebase origin/main || {
              echo "::error::rebase conflict - the observation was not recorded"
              git rebase --abort || true
              exit 1
            }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
