name: watch

# The longitudinal collector. Every run compares a fixed list of public MCP
# servers against an approved baseline and records what changed.
#
# The git history of baseline.json IS the dataset: every commit that touches it
# is a definition change, with a timestamp and a diff. No storage to build, and
# the record is publishable evidence rather than a private database.
#
# observations.csv carries the denominator - how many server-days produced no
# drift - because a drift rate needs both halves.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour to avoid the thundering herd
  workflow_dispatch:

# The GITHUB_TOKEN needs nothing beyond read: the commit is pushed with a
# deploy key scoped to this repository alone.
permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

env:
  # Not a secret, and deliberately visible. Several MCP servers gate tools/list
  # on an environment variable being SET, not on it being valid - they check the
  # credential at tools/call. So they can be watched with a placeholder and no
  # real API key, which removes the whole question of protecting one.
  WATCH_PLACEHOLDER: "not-a-real-key-0000000000"

  # Pinned rather than floating: the collector's job is to detect when tool
  # definitions change, so the measuring instrument must not change underneath
  # the measurement. Bump deliberately, and treat a bump as a re-baseline event.
  TOOLPRINT_SPEC: "toolprint[tokens]==0.3.2"

jobs:
  observe:
    runs-on: ubuntu-latest
    # Servers are contacted sequentially, so the per-server timeout multiplies
    # by the size of the watchlist: 36 x 60s is 36 minutes of pure waiting if
    # every one hangs. Raising the per-server timeout to 120s put the worst case
    # at 72 minutes, past this cap, which turns a degraded run into no run at
    # all. Headroom here instead of a longer per-server wait.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # This job downloads and executes 36 third-party packages - the very
          # packages it exists to be suspicious of - in this workspace. By
          # default actions/checkout writes a push-capable token into
          # .git/config, so any one of them could read it and push to this
          # repository. The token is supplied at the commit step instead, after
          # all third-party code has finished running.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5

      - name: Install toolprint
        # PyPI's JSON API can report a release minutes before the simple index
        # that pip actually reads carries it. Twice now a run has failed with
        # "no matching distribution" for a version that was demonstrably
        # published. Retrying costs a minute; failing loses the day's
        # observation, and a scheduled job that fails leaves a gap in the record
        # that cannot be backfilled.
        run: |
          for attempt in 1 2 3 4 5; do
            if pip install --quiet "$TOOLPRINT_SPEC"; then
              echo "installed on attempt $attempt"
              exit 0
            fi
            echo "install failed (attempt $attempt); the index may still be catching up"
            sleep 30
          done
          echo "::error::could not install $TOOLPRINT_SPEC after 5 attempts"
          exit 1

      - name: Download the watched packages before timing anything
        # Every failure on 2026-09-04 was "timed out after 60s", 23 of them, and
        # the observe step took 27 minutes - 23 x 60s of pure waiting. The cold
        # `npx -y` download sits inside toolprint's per-server timeout, so a
        # large package never finishes starting before the clock runs out.
        #
        # Downloading first moves that work outside the timed window, so the
        # observation measures what it means to measure: how long a server takes
        # to start and answer.
        #
        # Note this is NOT a cross-run cache. Each run still resolves fresh,
        # which is the whole point - an unpinned spec resolving differently on
        # two machines is what this collector exists to notice.
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python - <<'PY' > /tmp/pkgs.txt
          import json
          for name, entry in json.load(open("servers.json"))["mcpServers"].items():
              if entry.get("command") != "npx":
                  continue          # uv resolves fast enough to stay in the window
              for arg in entry.get("args") or []:
                  if not arg.startswith("-"):
                      print(arg)
                      break
          PY
          echo "warming $(wc -l < /tmp/pkgs.txt) npm package(s)"
          while read -r pkg; do
            # `node -e 0` installs the package without starting the server.
            timeout 180 npm exec --yes --package="$pkg" -- node -e 0 >/dev/null 2>&1 \
              && echo "  ok      $pkg" || echo "  skipped $pkg"
          done < /tmp/pkgs.txt

      - name: The watchlist must stay credential-free
        # Enforced rather than remembered. toolprint audits its own watchlist:
        # a literal credential pasted into servers.json is HYG-002, which exits
        # 1 and fails the job before anything is contacted or committed. A
        # "${VAR}" reference - including a prefixed one like "xoxb-${VAR}" -
        # passes.
        run: toolprint scan --config servers.json --fail-on high

      - name: Observe
        id: observe
        run: |
          set +e
          mkdir -p observations
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ ! -f baseline.json ]; then
            toolprint baseline --yes --timeout 60 \
              --config servers.json --baseline baseline.json \
              --by "watch workflow" --note "first observation"
            echo "drift=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --min-coverage 0 because this job does its own coverage accounting:
          # the denominator row records how many servers actually answered, and
          # a shortfall raises a workflow warning. A research collector should
          # record a degraded day, not refuse to.
          # findings/ and surfaces/ are kept, not just consumed. Everything the
          # collector measures beyond five integers used to be written to
          # RUNNER_TEMP and destroyed with the job: why a server was
          # unreachable, token cost, protocol era, effect classes, and the
          # findings themselves. And drift records that a description changed,
          # never what it said - hashes are one way - so the corpus could prove
          # a rug pull happened and never show it.
          mkdir -p findings surfaces
          toolprint check --yes --timeout 60 --fail-on none --min-coverage 0 \
            --config servers.json --baseline baseline.json \
            --format json --out "observations/$DATE.json" \
            --findings "findings/$DATE.json" \
            --bundle "surfaces/$DATE.json"
          cp "findings/$DATE.json" "$RUNNER_TEMP/findings.json"
          DRIFT=$(python -c "import json;print(len(json.load(open('observations/$DATE.json'))['changes']))")
          NEW=$(python -c "import json;print(len(json.load(open('observations/$DATE.json'))['new_servers']))")
          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          # approve re-contacts every server, so running it unconditionally meant
          # 72 cold package fetches a day rather than 36 - on most days to
          # approve nothing at all. Gated on there being something to accept:
          # drift to record, or a server added to servers.json since the last
          # run. Both jobs still happen, just not for free every night.
          # A toolprint upgrade can add fields the baseline does not carry yet -
          # server_version arrived this way and stayed empty, because approve
          # only ran on drift and there had been none. Treat a generator change
          # the same as drift: something to accept.
          GEN=$(python -c "import json;print(json.load(open('baseline.json')).get('generator',''))")
          WANT="toolprint/$(python -c "import toolprint;print(toolprint.__version__)")"
          if [ "$GEN" != "$WANT" ]; then
            echo "baseline written by '$GEN', now running '$WANT' - refreshing"
          fi
          if [ "$GEN" != "$WANT" ]; then
            # A plain approve only rewrites servers that drifted, so a baseline
            # written by an older build keeps its older fields indefinitely.
            # --refresh re-records every server; it accepts outstanding drift,
            # which is why it is reserved for exactly this case.
            toolprint approve --yes --timeout 60 --refresh \
              --config servers.json --baseline baseline.json \
              --by "watch workflow" --note "refreshed for $WANT on $DATE"
          elif [ "$DRIFT" != "0" ] || [ "$NEW" != "0" ]; then
            toolprint approve --yes --timeout 60 \
              --config servers.json --baseline baseline.json \
              --by "watch workflow" --note "observed $DATE"
          else
            echo "nothing to approve; not re-contacting the servers"
          fi
          exit 0

      - name: Explain any unreachable servers
        run: |
          python - "$RUNNER_TEMP/findings.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          if not os.path.exists(path):
              sys.exit(0)
          bad = [s for s in json.load(open(path))["servers"]
                 if s["fetch_status"] not in ("ok", "not_attempted")]
          if not bad:
              print("every server answered")
              sys.exit(0)
          print("{} server(s) did not answer:".format(len(bad)))
          for s in sorted(bad, key=lambda s: s["name"]):
              print("  {:<24} {:<14} {}".format(
                  s["name"], s["fetch_status"], (s["fetch_detail"] or "")[:90]))
          PY

      - name: Record the denominator
        env:
          OBS_DATE: ${{ steps.observe.outputs.date }}
          OBS_DRIFT: ${{ steps.observe.outputs.drift }}
        run: |
          python - "$OBS_DATE" "$OBS_DRIFT" "$RUNNER_TEMP/findings.json" <<'PY'
          import csv, json, os, sys
          date, drift, findings_path = sys.argv[1], sys.argv[2], sys.argv[3]

          # Measured from this run, not read back out of the baseline. The
          # earlier version reported the baseline's server count as "reachable",
          # so a day where two thirds of the servers failed to start looked
          # exactly like a quiet day: unreachable servers produce no drift.
          watched = len(json.load(open("servers.json"))["mcpServers"])
          reachable = tools = 0
          if os.path.exists(findings_path):
              doc = json.load(open(findings_path))
              ok = [s for s in doc["servers"] if s["fetch_status"] == "ok"]
              reachable = len({(s["name"], s["url_host"] or s["command_basename"]) for s in ok})
              tools = sum(s["tool_count"] or 0 for s in ok)

          # One row per date, not one per run. This appended, so re-running a
          # day - after a failure, or to verify a toolprint upgrade - left the
          # date in twice. analyse.py sums this column for the denominator, so
          # every extra row inflated server-days and deflated the drift rate:
          # an error in the direction that flatters the result.
          #
          # A repeat run supersedes the earlier one, except when it reached
          # fewer servers. A partial run measured a broken collector, not the
          # ecosystem, and must not overwrite the complete observation it is
          # standing next to.
          #
          # drift_changes is the exception: it keeps the highest seen that date
          # rather than the latest. Approving a day's drift means every later
          # run that day sees none, so carrying the latest across would erase
          # the day's findings whenever a date was re-run after approval - the
          # first re-run of 09-08 turned 6 observed version bumps into 0.
          path = "observations.csv"
          header = ["date", "watched", "reachable", "tools", "drift_changes"]
          rows = []
          if os.path.exists(path):
              with open(path) as fh:
                  rows = [r for r in csv.DictReader(fh)]

          row = dict(zip(header, [date, watched, reachable, tools, drift]))
          existing = next((r for r in rows if r["date"] == date), None)
          if existing is None:
              rows.append(row)
          elif int(tools) >= int(existing["tools"] or 0):
              row["drift_changes"] = max(int(drift), int(existing["drift_changes"] or 0))
              existing.update({k: str(v) for k, v in row.items()})
          else:
              print("::warning::{} already has a run that reached {} tools; "
                    "this run reached {} and was not recorded".format(
                        date, existing["tools"], tools))

          rows.sort(key=lambda r: r["date"])
          with open(path, "w", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=header)
              w.writeheader()
              w.writerows(rows)
          print("watched={} reachable={} tools={} drift={}".format(
              watched, reachable, tools, drift))
          if reachable < watched:
              print("::warning::{} of {} servers were not reachable this run".format(
                  watched - reachable, watched))
          PY

      - name: Nothing about the machine may be published
        env:
          OBS_DATE: ${{ steps.observe.outputs.date }}
        run: |
          # Runs before the deploy key is loaded, so a failure here cannot be
          # followed by a push. The bundle is safe by construction - bundle.py
          # projects through an allowlist - but findings.json is not: it
          # carries source_path and project, which are absolute paths holding a
          # username and whatever is being worked on. This collector passes a
          # relative --config and never discovers clients, so those come out
          # empty. That is a property of how it is invoked, not of the format,
          # and an unattended job should not depend on nobody ever editing an
          # invocation.
          python - "$OBS_DATE" <<'PY'
          import json, re, sys, pathlib
          date = sys.argv[1]
          BAD = {
              "absolute path": re.compile(r'"(?:/(?:Users|home|root|var|opt)/|[A-Z]:\\\\)'),
              "home marker": re.compile(r"[\"/](?:runner|home)/[a-z_][a-z0-9_-]*/\\."),
              "runner workspace": re.compile(r"/home/runner/work"),
          }
          MAX_BYTES = 8_000_000     # a server that emits a huge description
                                    # would otherwise bloat the repo forever
          failed = False
          for name in ("findings/%s.json" % date, "surfaces/%s.json" % date):
              path = pathlib.Path(name)
              if not path.exists():
                  print("::error::%s was not written" % name); failed = True; continue
              blob = path.read_text(encoding="utf-8")
              if len(blob) > MAX_BYTES:
                  print("::error::%s is %d bytes, over the %d cap"
                        % (name, len(blob), MAX_BYTES)); failed = True
              for label, rx in BAD.items():
                  m = rx.search(blob)
                  if m:
                      print("::error::%s contains a %s near %r"
                            % (name, label, blob[max(0, m.start()-40):m.start()+40]))
                      failed = True
              doc = json.loads(blob)
              for server in doc.get("servers", []):
                  for field in ("source_path", "project", "scope_detail"):
                      # The danger is an absolute path, not the field. This
                      # collector's source_path is "servers.json" - relative,
                      # and harmless. Rejecting the field outright failed every
                      # clean run when this guard was first tested.
                      value = server.get(field)
                      if isinstance(value, str) and (
                              value.startswith("/") or re.match(r"^[A-Za-z]:[\\\\/]", value)):
                          print("::error::%s carries an absolute %s: %s"
                                % (name, field, value)); failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Commit
        env:
          OBS_DATE: ${{ steps.observe.outputs.date }}
          OBS_DRIFT: ${{ steps.observe.outputs.drift }}
          OBS_NEW: ${{ steps.observe.outputs.new }}
          DEPLOY_KEY: ${{ secrets.WATCH_DEPLOY_KEY }}
        run: |
          # A deploy key rather than GITHUB_TOKEN: it can write to this one
          # repository and nothing else in the organisation, and the org's
          # default workflow permissions stay read-only for every other repo.
          # It is loaded here, at the last step, so it is never present while
          # the watched packages are executing.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config user.name "toolprint watch"
          git config user.email "noreply@github.com"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          DRIFT="$OBS_DRIFT"
          DATE="$OBS_DATE"
          NEW="$OBS_NEW"
          SUFFIX=""
          if [ "${NEW:-0}" != "0" ]; then SUFFIX=", $NEW newly watched"; fi
          if [ "$DRIFT" = "0" ]; then
            git commit -m "watch $DATE: no drift$SUFFIX"
          else
            git commit -m "watch $DATE: $DRIFT change(s) observed$SUFFIX"
          fi
          # The observation takes about ten minutes and commits at the end, so
          # anything pushed to this repository meanwhile leaves this checkout
          # behind and the push is rejected - losing the day's observation, and
          # failing quietly unless someone goes looking. Rebase onto whatever
          # arrived and retry; the commits are additive.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch -q origin main
            git rebase origin/main || {
              echo "::error::rebase conflict - the observation was not recorded"
              git rebase --abort || true
              exit 1
            }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
